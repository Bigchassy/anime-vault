media:
  input: media
  output: /anime-vault/media
  categories: [image]
content:
  - name: posts
    label: Blog articles
    type: file
    path: posts.json
    format: json
    list: true
    fields:
      - name: id
        label: Unique article ID (keep unchanged after publishing)
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: title
        label: Article title
        type: string
        required: true
      - name: category
        type: string
        required: true
      - name: author
        type: string
        default: Anime Vault
      - name: date
        type: date
      - name: image
        label: Cover image
        type: image
      - name: excerpt
        label: Short introduction
        type: text
        required: true
      - name: body
        label: Article text
        type: text
        required: true
      - name: published
        label: Show on website
        type: boolean
        default: false
